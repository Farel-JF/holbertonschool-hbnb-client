<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="styles_index.css">
</head>
<body>
    <header class="header-container">
        <a href="index.html" class="logo" aria-label="Home">
            <img src="logo.png" alt="HBNB Evolution Logo">
        </a>
        <nav class="nav-bar" aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="place.html">Places</a></li>
                <li><a href="add_review.html">Reviews</a></li>
            </ul>
        </nav>
        <div id="login-link" class="login-button">
            <a href="login.html" class="round-button" aria-label="Login">Login</a>
        </div>
    </header>
    <main>
        <h1>Available Places</h1>
        <section class="country-filter" aria-label="Country Filter">
            <label for="country-filter">Filter by country:</label>
            <select id="country-filter">
                <option value="all">All</option>
                <option value="United States">United States</option>
                <option value="Canada">Canada</option>
            </select>
        </section>
        <section id="places-list">
            <!-- Example place card, to be populated dynamically -->
            <div class="place-card">
                <img src="place1.jpg" alt="Beautiful Beach House" class="place-image">
                <div class="place-info">
                    <h3>Beautiful Beach House</h3>
                    <p><strong>Price per night:</strong> $150</p>
                    <p><strong>Location:</strong> Los Angeles, United States</p>
                    <a href="place.html" class="details-button">View Details</a>
                </div>
            </div>
            <div class="place-card">
                <img src="place2.jpg" alt="Mountain Retreat" class="place-image">
                <div class="place-info">
                    <h3>Mountain Retreat</h3>
                    <p><strong>Price per night:</strong> $200</p>
                    <p><strong>Location:</strong> Denver, United States</p>
                    <a href="place.html" class="details-button">View Details</a>
                </div>
            </div>
        </section>
        <div class="status-line">
            <div class="status-light"></div>
            <span class="status-text"></span>
        </div>
    </main>
    <footer>
        <p>© 2024 HBNB Evolution. All rights reserved.</p>
    </footer>
    <script src="scripts_index.js"></script>
</body>
</html>
