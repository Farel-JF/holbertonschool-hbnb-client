<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place</title>
    <link rel="stylesheet" href="styles_place.css">
    <script src="scripts_place.js" defer></script> <!-- Use defer to ensure DOM is loaded before script -->
</head>
<body>
    <header>
        <a href="index.html">
            <img src="logo.png" alt="Application Logo" class="logo">
        </a>
        <a href="login.html" class="login-button">Login</a>
    </header>
    <main class="container">
        <section id="place-details">
            <h2 class="text-center">Place Details</h2>
            <div class="place-info"></div> <!-- Will be populated dynamically -->
        </section>
        <section id="reviews">
            <h2 class="text-center">Reviews</h2>
            <div id="reviews-list"></div> <!-- Reviews will be populated dynamically -->
        </section>
        <section id="add-review" style="display: none;"> <!-- Hidden initially -->
            <h2 class="text-center">Add a Review</h2>
            <form id="reviewForm" class="review-form">
                <label for="review-text">Your Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>
                <label for="rating">Rating:</label>
                <select id="rating" name="rating" required>
                    <option value="5">5 Stars</option>
                    <option value="4">4 Stars</option>
                    <option value="3">3 Stars</option>
                    <option value="2">2 Stars</option>
                    <option value="1">1 Star</option>
                </select><h2 class="text-center">Add a Review</h2>
        <form action="submit_review.html" method="post" class="add-review-form">
            <label for="review-text">Your Review:</label>
            <textarea id="review-text" name="review-text" rows="4" required></textarea>
            <label for="rating">Rating:</label>
            <select id="rating" name="rating" required>
                <option value="1">1 Star</option>
                <option value="2">2 Stars</option>
                <option value="3">3 Stars</option>
                <option value="4">4 Stars</option>
                <option value="5">5 Stars</option>
            </select>
            <button type="submit" class="submit-review-button">Submit Review</button>
        </form>
        </section>
    </main>
    <footer>
        <p>© 2024 HBNB Evolution. All rights reserved.</p>
    </footer>
</body>
</html>
